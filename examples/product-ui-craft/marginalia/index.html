<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Marginalia — Reading room traffic</title>
  <link rel="stylesheet" href="app.css">
  <script src="traffic.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="mark" viewBox="0 0 40 40">
        <path fill="#484b98" d="M2 9.5 12 5l8.2 6.6V35l-9.3-7.2L2 30.9z"/>
        <path fill="#7679c6" d="m12 5 8.2 6.6L29 5v22.4L20.2 35l-8.2-7.5z"/>
        <path fill="#45478c" d="M20.2 11.6 29 5v22.4L20.2 35z"/>
        <path fill="#6669b6" d="m29 5 9 4.1v21.3l-9-3z"/>
      </symbol>
      <!-- Lucide icons, see LICENSE-lucide.txt -->
      <symbol id="square-pen" viewBox="0 0 24 24"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></symbol>
      <symbol id="search-icon" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
      <symbol id="files" viewBox="0 0 24 24"><path d="M15 2h-4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/><path d="M16.706 2.706A2.4 2.4 0 0 0 15 2v5a1 1 0 0 0 1 1h5a2.4 2.4 0 0 0-.706-1.706z"/><path d="M5 7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 1.732-1"/></symbol>
      <symbol id="folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
      <symbol id="panel-left" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></symbol>
      <symbol id="download" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></symbol>
      <symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="chart-no-axes-combined" viewBox="0 0 24 24"><path d="M12 16v5"/><path d="M16 14.639V21"/><path d="M20 10.656V21"/><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"/><path d="M4 18.463V21"/><path d="M8 14.656V21"/></symbol>
      <symbol id="arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
      <symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="file-spreadsheet" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></symbol>
      <symbol id="copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
      <symbol id="thumbs-up" viewBox="0 0 24 24"><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/><path d="M7 10v12"/></symbol>
      <symbol id="thumbs-down" viewBox="0 0 24 24"><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/><path d="M17 14V2"/></symbol>
      <symbol id="table-2" viewBox="0 0 24 24"><path d="M3 9h18"/><path d="M9 3v18"/><rect x="3" y="3" width="18" height="18" rx="2"/></symbol>
      <symbol id="chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    </defs>
  </svg>
  <div class="app" id="shell">
    <aside class="rail" id="rail" aria-label="Workspace navigation">
      <div class="rail-top">
        <div class="brand"><svg class="brand-icon" aria-hidden="true"><use href="#mark"/></svg><span>Marginalia</span></div>
        <nav class="tools" aria-label="Chat tools">
          <button class="new-chat" id="new-chat"><svg class="ic"><use href="#square-pen"/></svg>New chat</button>
          <button id="search"><svg class="ic"><use href="#search-icon"/></svg>Search chats <kbd id="search-key">⌘ K</kbd></button>
          <button id="sources"><svg class="ic"><use href="#files"/></svg>Source library</button>
        </nav>
        <div class="nav-group">
          <h2>Projects</h2>
          <button class="project-link" id="project"><svg class="ic"><use href="#folder"/></svg>Library study</button>
        </div>
        <div class="nav-group history">
          <h2>Recent chats</h2>
          <nav id="history" aria-label="Recent chats"></nav>
        </div>
      </div>
      <div class="profile"><span class="avatar">JL</span><span><strong>Jules Lin</strong><small>Personal workspace</small></span></div>
    </aside>
    <main class="workspace">
      <header class="bar">
        <button class="icon-button menu" aria-label="Open chat navigation" title="Open chat navigation" id="menu"><svg class="ic"><use href="#panel-left"/></svg></button>
        <div class="breadcrumb"><svg class="ic folder" aria-hidden="true"><use href="#folder"/></svg><span class="project-name">Library study</span><span class="separator">/</span><h1 id="chat-title">Reading room traffic</h1></div>
        <button class="export" id="export"><svg class="ic"><use href="#download"/></svg><span>Export chat</span></button>
      </header>
      <div class="scroll" id="scroll"><div class="reading thread" id="thread"></div></div>
      <div class="dock">
        <form class="composer reading" id="composer">
          <label class="sr-only" for="prompt">Message Marginalia</label>
          <div class="draft-file" id="draft-file" hidden></div>
          <textarea id="prompt" rows="1" placeholder="Ask a follow-up…" spellcheck="false"></textarea>
          <div class="compose-actions">
            <button class="icon-button attach" type="button" id="attach" title="Attach a source from the library" aria-label="Attach a source from the library"><svg class="ic"><use href="#plus"/></svg></button>
            <span class="mode"><svg class="ic" aria-hidden="true"><use href="#chart-no-axes-combined"/></svg>Data analysis</span>
            <button type="submit" class="send" id="send" aria-label="Send message" title="Send message" disabled><svg class="ic"><use href="#arrow-up"/></svg></button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <dialog id="drawer" class="drawer" aria-label="Chat navigation"></dialog>
  <dialog id="panel" class="panel" aria-labelledby="panel-title">
    <div class="panel-head"><h2 id="panel-title"></h2><form method="dialog"><button class="icon-button" aria-label="Close" title="Close"><svg class="ic"><use href="#x"/></svg></button></form></div>
    <div id="panel-body"></div>
  </dialog>
  <div id="notice" class="sr-only" role="status" aria-live="polite"></div>
  <template id="file-template">
    <button class="file" type="button" data-action="file">
      <span class="file-icon"><svg class="ic"><use href="#file-spreadsheet"/></svg></span><span><strong>reading-room.csv</strong><small>CSV spreadsheet</small></span>
    </button>
  </template>
  <template id="answer-template">
    <article class="reply">
      <div class="speaker"><span class="assistant-mark"><svg aria-hidden="true"><use href="#mark"/></svg></span><strong>Marginalia</strong></div>
      <div class="reply-content"></div>
      <div class="message-tools" aria-label="Response actions">
        <button type="button" class="icon-button" aria-label="Copy answer" title="Copy answer" data-action="copy"><svg class="ic"><use href="#copy"/></svg></button>
        <button type="button" class="icon-button" aria-label="Helpful answer" title="Helpful answer" aria-pressed="false" data-action="helpful"><svg class="ic"><use href="#thumbs-up"/></svg></button>
        <button type="button" class="icon-button" aria-label="Unhelpful answer" title="Unhelpful answer" aria-pressed="false" data-action="unhelpful"><svg class="ic"><use href="#thumbs-down"/></svg></button>
      </div>
    </article>
  </template>
  <template id="chart-template">
    <figure class="chart">
      <div class="chart-head">
        <div><h3>Reading room visits</h3><p>Average visitors by hour</p></div>
        <div class="legend"><span><i class="line weekday"></i>Weekdays</span><span><i class="line weekend"></i>Weekends</span></div>
      </div>
      <svg class="plot" aria-label="Line chart of average weekday and weekend visits" role="img"></svg>
      <figcaption><button type="button" class="data-link" data-action="file"><svg class="ic"><use href="#table-2"/></svg>View source data <svg class="ic go"><use href="#chevron-right"/></svg></button></figcaption>
    </figure>
  </template>
  <script type="text/csv" id="dataset">
hour,weekday,weekend
08:00,12,7
09:00,28,14
10:00,47,24
11:00,64,38
12:00,72,55
13:00,68,73
14:00,54,86
15:00,45,82
16:00,34,67
17:00,22,46
18:00,12,24
  </script>
</body>
</html>
