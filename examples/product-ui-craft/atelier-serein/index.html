<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ee">
  <title>Serein Research — Machine perception</title>
  <link rel="stylesheet" href="site.css">
  <script src="site.js" defer></script>
</head>
<body id="top">
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="disc"><circle cx="20" cy="20" r="19"/></clipPath>
      <symbol id="mark" viewBox="0 0 40 40">
        <g clip-path="url(#disc)" fill="none" stroke="currentColor" stroke-width="2.7">
          <path d="M-6 -4V17Q-6 31 12 31H47 M-1 -4V15Q-1 26 13 26H47 M4 -4V12Q4 21 14 21H47 M9 -4V9Q9 16 15 16H47 M14 -4V7Q14 11 17 11H47 M19 -4V4Q19 6 22 6H47 M-8 36H47"/>
        </g>
      </symbol>
      <symbol id="arrow-right" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
      <symbol id="arrow-up" viewBox="0 0 24 24"><path d="M6 18 18 6M7 6h11v11"/></symbol>
      <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </defs>
  </svg>
  <header class="masthead frame">
    <a class="wordmark" href="#top" aria-label="Serein Research home">
      <svg class="seal" viewBox="0 0 40 40" aria-hidden="true"><use href="#mark"/></svg>
      <span>Serein Research</span>
    </a>
    <nav aria-label="Main navigation">
      <a class="nav-text" href="#publications">Publications</a>
      <button class="nav-text" data-note="approach">Approach</button>
      <button class="about-button" data-note="about">About the lab <svg class="icon" aria-hidden="true"><use href="#arrow-up"/></svg></button>
    </nav>
  </header>
  <main class="frame">
    <section class="hero" aria-labelledby="hero-title">
      <div class="intro">
        <p class="topic">Machine perception</p>
        <h1 id="hero-title"><span>How machines</span> <span>learn to <em>see.</em></span></h1>
        <p class="summary">We study how vision models make sense of light, shape and depth, and where their picture of the world breaks down.</p>
        <button class="primary" data-note="light">Read our latest paper <svg class="icon" aria-hidden="true"><use href="#arrow-right"/></svg></button>
      </div>
      <figure class="plate">
        <img src="refraction.jpg" width="1536" height="1024" alt="An upright convex lens bends parallel black rays across a coral-coloured optical plate.">
        <figcaption><span class="fig-no">Fig. 01</span><span>Refraction through a convex lens</span></figcaption>
      </figure>
    </section>
    <section class="publications" id="publications" aria-labelledby="publications-title">
      <div class="section-head">
        <h2 id="publications-title">From the lab</h2>
        <span class="section-detail">Publications &amp; field notes</span>
      </div>
      <div class="papers">
        <button class="paper" data-note="light">
          <canvas width="336" height="224" class="thumb" id="light-plate" aria-hidden="true"></canvas>
          <span class="paper-info"><span class="meta">Research paper <span>·</span> Oct 2026</span><span class="paper-title">What survives a change in light?</span></span>
          <svg class="icon paper-arrow" aria-hidden="true"><use href="#arrow-up"/></svg>
        </button>
        <button class="paper" data-note="depth">
          <canvas width="336" height="224" class="thumb" id="depth-plate" aria-hidden="true"></canvas>
          <span class="paper-info"><span class="meta">Field note <span>·</span> Sep 2026</span><span class="paper-title">Depth from a second glance</span></span>
          <svg class="icon paper-arrow" aria-hidden="true"><use href="#arrow-up"/></svg>
        </button>
      </div>
    </section>
  </main>
  <dialog aria-labelledby="note-title" id="note-dialog">
    <div class="dialog-head"><span class="topic" id="note-type"></span><form method="dialog"><button class="close-button" aria-label="Close" title="Close"><svg class="icon" aria-hidden="true"><use href="#close"/></svg></button></form></div>
    <h2 id="note-title" tabindex="-1"></h2>
    <div id="note-body"></div>
    <button class="note-link" data-note="approach" hidden>Read about our approach <svg class="icon" aria-hidden="true"><use href="#arrow-right"/></svg></button>
  </dialog>
</body>
</html>
